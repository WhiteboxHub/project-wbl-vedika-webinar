port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 60000
  # Let LiveKit auto-detect the machine's IP (not hardcoded to 127.0.0.1)
  use_external_ip: false
  tcp_port: 7881
  enable_loopback_candidate: true
  # Use Google's public STUN servers so WebRTC works across the local network/tunnel
  stun_servers:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

redis:
  address: redis:6379

keys:
  devkey: secret

logging:
  level: info
  sample: false

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

turn:
  enabled: false
