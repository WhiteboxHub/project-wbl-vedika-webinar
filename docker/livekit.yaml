port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  # UDP port range for WebRTC media — must match docker-compose ports mapping.
  # Smaller range = faster Docker setup on Windows.
  port_range_start: 50000
  port_range_end: 50020
  # Advertise the Windows host loopback. Docker Desktop port-forwards from
  # 0.0.0.0 on Windows to the container, so clients connect via 127.0.0.1.
  node_ip: 127.0.0.1
  # TCP WebRTC fallback on 7881 — already exposed in docker-compose.
  # Browser tries UDP first; falls back to TCP automatically if UDP is blocked.
  tcp_port: 7881
  enable_loopback_candidate: true
  # Bare host:port — LiveKit prepends stun: itself
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

redis:
  address: redis:6379

keys:
  devkey: devkey-local-secret-change-in-production-00

logging:
  level: info
  sample: false

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100

turn:
  enabled: false
