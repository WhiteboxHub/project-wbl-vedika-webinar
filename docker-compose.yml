version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webinar-postgres
    environment:
      POSTGRES_DB: webinar_db
      POSTGRES_USER: webinar
      POSTGRES_PASSWORD: webinar
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webinar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webinar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: webinar-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"          # HTTP / WebSocket signaling
      - "7881:7881"          # TCP WebRTC fallback
      - "50000-50020:50000-50020/udp"  # UDP media (21 ports, matches livekit.yaml)
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    container_name: webinar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
